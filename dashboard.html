<!DOCTYPE html>
<html lang="zh-Hant" data-mode="sweet">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的食譜庫 · 食譜箱 RecipeBox</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-mode="sweet">

  <header class="topbar">
    <div class="brand">食譜箱 <span>RecipeBox</span></div>
    <nav class="nav-links">
      <a href="index.html">首頁</a>
      <a href="dashboard.html" class="active">我的食譜庫</a>
      <a href="edit_recipe.html">新增食譜</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="toolbar" style="border-bottom:none; margin-bottom:16px;">
      <!-- 只保留收藏按鈕，並預設讓它保持啟動 (is-active) 或直接抓取收藏 -->
      <button class="tag-pill is-active" data-filter="fav">★ 收藏</button>
      
      <!-- 搜尋框 -->
      <input class="search-input" id="searchInput" type="search" placeholder="搜尋收藏的食譜…" style="max-width:280px;" />
      
      <!-- 右側的新增食譜與同步狀態 -->
      <a class="btn btn-accent" href="edit_recipe.html" style="margin-left:auto;">＋ 新增食譜</a>
      <span class="sync-badge" id="syncBadge"><span class="dot"></span><span class="label">同步中…</span></span>
    </div>

    <!-- 食譜卡片網格 -->
    <section class="recipe-grid" id="recipeGrid" aria-live="polite">
      <div class="empty-state">正在讀取收藏…</div>
    </section>

    <!-- 隨機推薦彈出視窗 Modal -->
    <div id="randomModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
      <div style="background: #fff; width: 90%; max-width: 400px; border-radius: 16px; padding: 20px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        
        <!-- 標題與關閉按鈕 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h3 style="margin: 0; font-size: 18px; color: #333;">今日推薦食譜</h3>
          <button id="closeModalBtn" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #888;">&times;</button>
        </div>

        <!-- 卡片放置容器 -->
        <div id="modalCardBody"></div>

        <!-- 下方按鈕區 (包含再抽一次) -->
        <div style="margin-top: 15px; text-align: right;">
          <button id="drawAgainBtn" class="btn btn-ghost" style="padding: 8px 16px; background: #6c757d; color: #fff; border-radius: 8px; border: none; cursor: pointer;">再抽一次</button>
        </div>
      </div>
    </div>
    
  </main>

  <footer class="page-foot">RecipeBox · 共 <span id="countLabel">0</span> 道食譜</footer>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
