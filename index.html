<!DOCTYPE html>
<html lang="zh-Hant" data-mode="sweet">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recipe</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-mode="all">

  <header class="topbar">
    <div class="brand"><span>Recipe</span></div>
    <nav class="nav-links">
      <a href="index.html" class="active">首頁</a>
      <a href="dashboard.html">我的收藏</a>
      <a href="edit_recipe.html">新增食譜</a>
    </nav>
  </header>

  <main class="wrap">
    <!-- 加上「全部」按鈕 -->
<div class="tab-switcher" role="tablist" aria-label="甜食或鹹食模式">
  <!-- 讓「全部」按鈕預設帶有 is-active -->
  <button class="tab-divider is-active" data-tab="all" role="tab">
    <span class="tab-tag">Mode / 00</span>
    🌐 全部
  </button>

  <button class="tab-divider" data-tab="sweet" role="tab">
    <span class="tab-tag">Mode / 01</span>
    🍰 甜食
  </button>
  
  <button class="tab-divider" data-tab="savory" role="tab">
    <span class="tab-tag">Mode / 02</span>
    🍳 鹹食
  </button>
</div>

    <div class="toolbar">
      <input class="search-input" id="searchInput" type="search" placeholder="搜尋食譜名稱或標籤…" />
      <div id="tagPills" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
      <button class="btn btn-accent btn-random" id="randomBtn">🎲 隨機推薦今天吃什麼</button>
      <span class="sync-badge" id="syncBadge"><span class="dot"></span><span class="label">同步中…</span></span>
    </div>

    <!-- 隨機推薦彈出視窗 Modal -->
    <div id="randomModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
      <div style="background: #fff; width: 90%; max-width: 400px; border-radius: 16px; padding: 20px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        
        <!-- 標題與關閉按鈕 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h3 style="margin: 0; font-size: 18px; color: #333;">今日推薦食譜</h3>
          <button id="closeModalBtn" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #888;">&times;</button>
        </div>

        <!-- 卡片放置容器 -->
        <div id="modalCardBody"></div>

        <!-- 下方按鈕區 (包含再抽一次) -->
        <div style="margin-top: 15px; text-align: right;">
          <button id="drawAgainBtn" class="btn btn-ghost" style="padding: 8px 16px; background: #6c757d; color: #fff; border-radius: 8px; border: none; cursor: pointer;">再抽一次</button>
        </div>
      </div>
    </div>

    <section class="recipe-grid" id="recipeGrid" aria-live="polite">
      <div class="empty-state">正在讀取食譜…</div>
    </section>

  </main>

  <footer class="page-foot">RecipeBox · Firebase Firestore + IndexedDB 離線快取</footer>

  <script type="module" src="index.js"></script>
</body>
</html>
